name: Web · GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Verificar y construir
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          check-latest: true
          cache: npm

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Ejecutar pruebas
        run: npm run test:run

      - name: Construir la aplicación web
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Empaquetar la web
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publicar
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
