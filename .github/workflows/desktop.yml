name: Desktop · Windows, Linux y macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-24.04
            args: "--bundles deb,appimage"
            artifact: linux-x64
            rust-targets: ""
          - name: Windows x64
            platform: windows-latest
            args: ""
            artifact: windows-x64
            rust-targets: ""
          - name: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
            artifact: macos-arm64
            rust-targets: "aarch64-apple-darwin"
          - name: macOS Intel
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
            artifact: macos-x64
            rust-targets: "x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7

      - name: Dependencias nativas de Linux
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          check-latest: true
          cache: npm

      - name: Preparar Rust estable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Comprobar el frontend
        run: npm run test:run

      - name: Compilar y empaquetar Tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          retryAttempts: 2
          tagName: "${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.head_commit.message, 'feat: lanzar IDE híbrido')) && 'v__VERSION__' || '' }}"
          releaseName: "${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.head_commit.message, 'feat: lanzar IDE híbrido')) && 'IDE v__VERSION__' || '' }}"
          releaseBody: "${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.head_commit.message, 'feat: lanzar IDE híbrido')) && 'IDE híbrido para Windows, Linux y macOS. Consulta el README para capacidades y requisitos de toolchains.' || '' }}"
          releaseDraft: false
          prerelease: false

      - name: Conservar instaladores de esta compilación
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: IDE-${{ matrix.artifact }}
          path: |
            src-tauri/target/**/release/bundle/**/*
            src-tauri/Cargo.lock
          if-no-files-found: warn
          retention-days: 14
