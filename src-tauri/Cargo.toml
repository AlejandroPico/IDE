[package]
name = "alejandropico-ide"
version = "0.2.0"
description = "IDE híbrido multilenguaje para web y escritorio"
authors = ["Alejandro Pico"]
edition = "2024"
rust-version = "1.93"
license = "MIT"

[lib]
name = "ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "time"] }
rfd = "0.15"
walkdir = "2.5"
futures = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
